name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SKILL_GROUPS_DIR: ${{ github.workspace }}/.groups

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This repository is the index; the skills live in the seven group repositories listed in
      # groups.json. Check each one out under .groups/<id>/ and point the build and the tests at
      # them with SKILL_GROUPS_DIR. The groups are public, so no token is needed. Keep this list
      # in step with groups.json: test_docs_site.py checks that it is.
      - { name: Checkout claude-skills-dotnet, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-dotnet, path: .groups/claude-skills-dotnet } }
      - { name: Checkout claude-skills-language-gurus, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-language-gurus, path: .groups/claude-skills-language-gurus } }
      - { name: Checkout claude-skills-engineering-practices, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-engineering-practices, path: .groups/claude-skills-engineering-practices } }
      - { name: Checkout claude-skills-api, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-api, path: .groups/claude-skills-api } }
      - { name: Checkout claude-skills-ai-engineering, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-ai-engineering, path: .groups/claude-skills-ai-engineering } }
      - { name: Checkout claude-skills-dev-environment, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-dev-environment, path: .groups/claude-skills-dev-environment } }
      - { name: Checkout claude-skills-gcse-tutors, uses: actions/checkout@v4, with: { repository: markpitt/claude-skills-gcse-tutors, path: .groups/claude-skills-gcse-tutors } }

      # mise owns the Node version, so the site is built with the same
      # toolchain as everything else rather than a second pinned version.
      - uses: jdx/mise-action@v2

      # The tests that assert the generated HTML (tests/validation/test_docs_site.py) stay in the
      # monorepo and run there before a release reaches this repository. Here the validator is the
      # gate: a skill that does not parse must not reach the site.
      - name: Validate the skills
        run: mise run skill:validate

      - name: Build documentation
        run: node scripts/build-docs.js

      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
