name: Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'skills-tui/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'skills-tui/**'

# Builds the skills-tui API docs and keeps them as a run artifact. It no longer deploys them:
# GitHub Pages here is the skills site (deploy-pages.yml), and the token is read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cd skills-tui && cargo doc --no-deps --document-private-items

      - name: Add redirect index.html
        run: |
          cd skills-tui/target/doc
          echo '<meta http-equiv="refresh" content="0;url=skills_tui/index.html">' > index.html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: skills-tui/target/doc/
