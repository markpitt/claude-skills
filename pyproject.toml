[project]
name = "claude-skills"
version = "0.1.0"
description = "Skill quality and trigger evaluation harness"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "deepeval>=1.4.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TC", "RUF", "PT", "S", "ANN"]
ignore = ["ANN401"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests/eval"]
addopts = [
    "--strict-markers",
    "-q",
]
